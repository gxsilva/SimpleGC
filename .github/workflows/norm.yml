name: Norminette

on:
  workflow_call:
    
jobs:
  Norminette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Install uv shell
        uses: astral-sh/setup-uv@v5
      
      - name: Set up Python
        uses: uv python install
      
      - name: Create venv
        run: uv venv
      
      - name: Install and run Norminette
        run: |
          source .venv/bin/activate
          uv pip install norminette
          norminette src/ debug/ includes/
